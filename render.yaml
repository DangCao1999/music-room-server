# Render Blueprint (Dashboard → New → Blueprint). If the service was created by hand
# in the dashboard instead, this file is ignored: set the same env vars there.
# Database: Neon (free, no expiry) — see deploy/README.md §8.
services:
  - type: web
    name: muzic-room-server
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    # Runs `prisma migrate deploy` before the server listens.
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      # Render sits behind a proxy: needed for per-IP rate limits.
      - key: TRUST_PROXY
        value: "true"
      # No persistent disk on the free plan; JWT_SECRET below makes sessions survive restarts.
      - key: DATA_DIR
        value: /tmp/music-room
      - key: JWT_SECRET
        generateValue: true
      # Set in the dashboard (sync: false = not stored in git):
      - key: DATABASE_URL # Neon pooled URL (…-pooler…/neondb?sslmode=require&channel_binding=require)
        sync: false
      - key: DIRECT_URL # Neon direct URL (same, without "-pooler"), used only for migrations
        sync: false
      - key: PUBLIC_URL # https://<your-app>.vercel.app
        sync: false
      - key: CORS_ORIGINS # https://<your-app>.vercel.app (comma-separated)
        sync: false
      - key: YOUTUBE_API_KEY # optional: search + fallback playlist
        sync: false
