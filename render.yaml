# Render Blueprint (Dashboard → New → Blueprint). If the service was created by hand
# in the dashboard instead, this file is ignored: set the same env vars there.
# Database: Neon (free, no expiry) — see deploy/README.md §8.
services:
  - type: web
    name: music-room-api
    runtime: node
    plan: free
    # Same region as Neon (AWS ap-southeast-1) and close to Vietnam. Render cannot move
    # an existing service: a different region means a new service (deploy/README.md §8.6).
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    # Runs `prisma migrate deploy` before the server listens.
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      # Render sits behind a proxy: needed for per-IP rate limits.
      - key: TRUST_PROXY
        value: "true"
      # No persistent disk on the free plan; JWT_SECRET below makes sessions survive restarts.
      - key: DATA_DIR
        value: /tmp/music-room
      - key: JWT_SECRET
        generateValue: true
      # Set in the dashboard (sync: false = not stored in git):
      - key: DATABASE_URL # Neon pooled URL (…-pooler…/neondb?sslmode=require&channel_binding=require)
        sync: false
      - key: DIRECT_URL # Neon direct URL (same, without "-pooler"), used only for migrations
        sync: false
      - key: PUBLIC_URL # the web address, e.g. https://musicroom.io.vn (or https://<your-app>.vercel.app)
        sync: false
      - key: CORS_ORIGINS # web addresses allowed to call the API, comma-separated, e.g. https://musicroom.io.vn,https://<your-app>.vercel.app
        sync: false
      - key: YOUTUBE_API_KEY # optional: search + fallback playlist
        sync: false
      - key: GOOGLE_CLIENT_ID # optional: "Đăng nhập với Google" (public OAuth client id)
        sync: false
      - key: LASTFM_API_KEY # optional: similar songs (suggestions, radio)
        sync: false
      - key: GEMINI_API_KEY # optional: free AI, tried first
        sync: false
      - key: GROQ_API_KEY # optional: free AI, fallback
        sync: false
